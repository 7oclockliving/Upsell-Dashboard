# ============================================================================
# Tägliche Aktualisierung des SEVN Upsell-Dashboards (7 o'clock)
# Holt Bestelldaten aus Shopify, schreibt docs/data.json und veröffentlicht
# damit automatisch die neue Version der GitHub-Pages-Seite.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   SHOPIFY_SHOP        z.B. 7oclock-de.myshopify.com
#   SEVN_CLIENT_ID      Client-ID der App "sevn-checkout-upsell" (Dev Dashboard)
#   SEVN_CLIENT_SECRET  Client-Secret derselben App (Dev Dashboard → API-Anmeldedaten)
# GitHub Pages einmalig aktivieren: Settings → Pages → Branch main, /docs
# ============================================================================
name: Update Upsell-Dashboard

on:
  schedule:
    - cron: "0 8 * * *" # täglich 08:00 UTC = 10:00 deutscher Sommerzeit (Winter: 09:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Daten aus Shopify holen
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SEVN_CLIENT_ID: ${{ secrets.SEVN_CLIENT_ID }}
          SEVN_CLIENT_SECRET: ${{ secrets.SEVN_CLIENT_SECRET }}
        run: node scripts/fetch_data.mjs
      - name: Änderungen committen
        run: |
          git config user.name "sevn-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
            exit 0
          fi
          git commit -m "Datenupdate $(date -u +%F)"
          # Push-Race-Schutz (13.08.2026): Falls zwischenzeitlich manuell auf
          # main committet wurde, erst rebasen und mit Wiederholungen pushen,
          # statt den Lauf mit "fetch first" scheitern zu lassen.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push abgelehnt – rebase & Wiederholung $i…"
            git pull --rebase origin main || true
            sleep 5
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
